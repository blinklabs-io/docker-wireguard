# Generated automatically by org-governance-bot. Do not edit manually.
name: "ci"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
      - v*.*.*

jobs:
  go:
    needs: [golangci-lint]
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main
    with:
      go-versions: '["1.26.x"]'
      test-flags: -race
  golangci-lint:
    uses: blinklabs-io/actions/.github/workflows/reuseable-golangci-lint.yml@main
  nilaway:
    needs: [golangci-lint]
    uses: blinklabs-io/actions/.github/workflows/reuseable-nilaway.yml@main
    with:
      include-pkgs: github.com/blinklabs-io/docker-wireguard
  publish:
    needs: [go, nilaway]
    if: github.event_name == 'push'
    uses: blinklabs-io/actions/.github/workflows/reuseable-publish.yml@main
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
    with:
      binary-compress: true
      binary-name: wg-peer-api
      binary-os-matrix: '["linux"]'
      build-args: |-
        VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
        COMMIT_HASH=${{ github.sha }}
      description: WireGuard VPN container with JWT-authenticated peer API
      docker-image: blinklabs/wireguard
      go-version: 1.26.x
