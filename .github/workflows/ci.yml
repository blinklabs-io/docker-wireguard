name: "ci"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
      - v*.*.*

jobs:
  go:
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main
    with:
      go-versions: '["1.26.x","1.27.x"]'
      nilaway-include-pkgs: github.com/blinklabs-io/docker-wireguard
      run-golangci-lint: true
      run-nilaway: true
      test-flags: -race
  publish:
    needs: [go]
    if: github.event_name == 'push'
    uses: blinklabs-io/actions/.github/workflows/reuseable-publish.yml@d3aa875070b18acdcb31256100558d44c16b512f
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
    with:
      binary-compress: true
      binary-name: wg-peer-api
      binary-target-matrix: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"}]'
      build-args: |-
        VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
        COMMIT_HASH=${{ github.sha }}
      description: WireGuard VPN container with JWT-authenticated peer API
      docker-image: blinklabs/wireguard
      go-version: 1.26.10
